{% extends 'layout.html' %}

{% block content %}
  <form action="{{ url_for('create_contact') }}" method="post">
    <div>
      <label for="name">Name:</label>
      <input type="text" id="name" name="user_name" placeholder="Your Full Name" required>
    </div>

    <div>
      <label for="phone">Phone:</label>
      <input type="tel" id="phone" name="user_phone" placeholder="123-456-7890">
    </div>
    <div>
      <label for="email">Email:</label>
      <input type="email" id="email" name="user_email" placeholder="email@example.com" required>
    </div>
    <button type="submit">Submit</button>

  </form>
{% endblock %}
