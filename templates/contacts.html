{% extends 'layout.html' %}

{% block content %}
  {% if contacts %}
    <ul>
      {% for contact in contacts %}
        <li>
          <p>{{ contact.name }}</p>
          <p>{{ contact.phone }}</p>
          <p>{{ contact.email }}</p>
          <p>{{ contact.category }}</p>
          <form action="{{ url_for('edit_contact', contact_id=contact.id) }}"
                method="get">
            <button type="submit">edit</button>
          </form>
          <form action="{{ url_for('delete_contact', contact_id=contact.id) }}"
                method="post">
            <button type="submit">delete</button>
          </form>
        </li>
        <br>
      {% endfor %}
    </ul>
  {% else %}
    <p>no contacts</p>
  {% endif %}
  <form action="{{ url_for('add_contact') }}" method="get">
    <button type="submit">Add Contact</button>
  </form>
{% endblock %}
